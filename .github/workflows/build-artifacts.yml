name: Build Extension Artifacts

on:
  workflow_dispatch:
    inputs:
      build_chrome:
        description: 'Build Chrome extension'
        required: false
        type: boolean
        default: true
      build_firefox:
        description: 'Build Firefox extension'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build Extension Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Use patched project Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.1"
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Turbo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build Chrome Extension
        if: inputs.build_chrome
        run: bun run zip

      - name: Build Firefox Extension
        if: inputs.build_firefox
        run: bun run zip:firefox

      - name: Get Extension Version
        id: version
        run: echo "version=$(jq -r '.version' packages/extension/package.json)" >> $GITHUB_OUTPUT

      - name: Upload Chrome Artifact
        if: inputs.build_chrome
        uses: actions/upload-artifact@v4
        with:
          name: tabcanopy-chrome-v${{ steps.version.outputs.version }}
          path: packages/extension/.output/*-chrome.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Firefox Artifact
        if: inputs.build_firefox
        uses: actions/upload-artifact@v4
        with:
          name: tabcanopy-firefox-v${{ steps.version.outputs.version }}
          path: packages/extension/.output/*-firefox.zip
          if-no-files-found: error
          retention-days: 30

      - name: Add Job Summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "## 🎉 Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Extension version: **v${VERSION}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ inputs.build_chrome }}" == "true" ]; then
            echo "- ✅ Chrome extension built" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ inputs.build_firefox }}" == "true" ]; then
            echo "- ✅ Firefox extension built" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the artifacts from the workflow run summary above." >> $GITHUB_STEP_SUMMARY
